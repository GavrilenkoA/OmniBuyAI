<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Perekrestok brand gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b059;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#008a43;stop-opacity:1" />
    </linearGradient>
    <!-- Shadow gradient -->
    <linearGradient id="shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#brandGrad)"/>
  
  <!-- Inner shadow for depth -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#shadow)"/>
  
  <!-- Shopping basket handle -->
  <path d="M 42 52 C 42 40 52 32 64 32 C 76 32 86 40 86 52" stroke="white" stroke-width="7" fill="none" stroke-linecap="round"/>
  
  <!-- Shopping basket body -->
  <path d="M 32 50 L 40 92 C 41 98 47 102 54 102 L 74 102 C 81 102 87 98 88 92 L 96 50" stroke="white" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Basket weave lines -->
  <line x1="44" y1="62" x2="84" y2="62" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="46" y1="74" x2="82" y2="74" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="48" y1="86" x2="80" y2="86" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  
  <!-- AI sparkle/star -->
  <path d="M 98 28 L 100 32 L 104 34 L 100 36 L 98 40 L 96 36 L 92 34 L 96 32 Z" fill="white" opacity="0.9"/>
</svg>
