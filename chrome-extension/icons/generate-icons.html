<!DOCTYPE html>
<html>
<head>
  <title>Icon Generator</title>
</head>
<body>
  <canvas id="canvas" width="128" height="128"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Gradient background
    const gradient = ctx.createLinearGradient(0, 0, 128, 128);
    gradient.addColorStop(0, '#00a651');
    gradient.addColorStop(1, '#008a43');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 128, 128);

    // Shopping cart
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    ctx.beginPath();
    ctx.moveTo(30, 50);
    ctx.lineTo(40, 50);
    ctx.lineTo(45, 80);
    ctx.lineTo(95, 80);
    ctx.lineTo(100, 50);
    ctx.lineTo(50, 50);
    ctx.stroke();

    // Wheels
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(50, 90, 6, 0, Math.PI * 2);
    ctx.arc(85, 90, 6, 0, Math.PI * 2);
    ctx.fill();

    // AI sparkles
    ctx.beginPath();
    ctx.arc(80, 35, 4, 0, Math.PI * 2);
    ctx.arc(90, 42, 3, 0, Math.PI * 2);
    ctx.arc(72, 40, 3, 0, Math.PI * 2);
    ctx.fill();

    // Download links
    const sizes = [16, 48, 128];
    sizes.forEach(size => {
      const link = document.createElement('a');
      link.download = `icon${size}.png`;
      link.href = canvas.toDataURL('image/png');
      link.textContent = `Download icon${size}.png`;
      link.style.display = 'block';
      document.body.appendChild(link);
    });
  </script>
</body>
</html>
